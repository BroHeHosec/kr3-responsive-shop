<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bgDesktop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#444444"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0057b8"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="1200" height="675" fill="url(#bgDesktop)"/>
  
  <!-- Абстрактная графика -->
  <circle cx="1000" cy="150" r="300" fill="url(#accent)" opacity="0.1"/>
  <circle cx="200" cy="550" r="200" fill="url(#accent)" opacity="0.1"/>
  
  <!-- Центральная композиция (товары / коробки) -->
  <g transform="translate(600, 300)">
    <!-- Коробка 1 -->
    <rect x="-150" y="-60" width="100" height="120" rx="8" fill="#0057b8" opacity="0.8"/>
    <path d="M-150,-60 L-100,-80 L-50,-60 L-100,-40 Z" fill="#0057b8" opacity="0.6"/>
    
    <!-- Коробка 2 -->
    <rect x="-20" y="-40" width="140" height="80" rx="8" fill="#ffffff" opacity="0.9"/>
    <path d="M-20,-40 L30,-60 L170,-60 L120,-40 Z" fill="#ffffff" opacity="0.7"/>
    
    <!-- Коробка 3 -->
    <rect x="150" y="-70" width="80" height="140" rx="8" fill="#eef5ff" opacity="0.8"/>
  </g>
  
  <!-- Текст -->
  <text x="50%" y="85%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" fill="#ffffff" font-weight="bold">Десктопная версия</text>
  <text x="50%" y="92%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#b3d4fc">Широкий экран</text>
</svg>