<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <defs>
    <linearGradient id="bgMobile" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0057b8"/>
      <stop offset="100%" stop-color="#003f86"/>
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="640" height="360" fill="url(#bgMobile)"/>
  
  <!-- Абстрактные фигуры -->
  <circle cx="550" cy="80" r="120" fill="#ffffff" opacity="0.1"/>
  <circle cx="100" cy="300" r="80" fill="#ffffff" opacity="0.1"/>
  
  <!-- Иконка магазина / корзины -->
  <g transform="translate(320, 180)" fill="#ffffff" opacity="0.9">
    <path d="M-40,-20 L40,-20 L30,40 L-30,40 Z" />
    <path d="M-20,-20 C-20,-40 20,-40 20,-20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-15" cy="50" r="8" fill="#ffffff"/>
    <circle cx="15" cy="50" r="8" fill="#ffffff"/>
  </g>
  
  <!-- Текст -->
  <text x="50%" y="80%" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#ffffff" font-weight="bold">Мобильная версия</text>
</svg>